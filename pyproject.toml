[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Public FAERS evidence packet for a human reviewer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "langgraph>=0.2.0",
  "requests>=2.32.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "matplotlib>=3.8.0",
  "pyyaml>=6.0.0",
  "streamlit>=1.44.0",
  "anthropic>=0.40.0",
  "openai>=1.50.0",
  "weasyprint>=62.0",
  "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
